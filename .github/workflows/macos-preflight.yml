name: FPC macOS native and smart TLS preflight
on:
  workflow_dispatch:
    inputs:
      official_bootstrap:
        description: 'Owner-approved official FPC3.2.2 temporary bootstrap'
        required: true
        type: boolean
        default: false
      expected_commit:
        description: 'Exact reviewed carrier commit to check out'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fpc-native-tls-macos-preflight
  cancel-in-progress: false
jobs:
  preflight:
    name: macOS ${{ matrix.arch }} native and smart TLS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      EXPECTED_CARRIER_COMMIT: ${{ inputs.expected_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Verify fixed payload and apply against its FPC baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CARRIER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER_COMMIT"
          python3 ci/verify_payload.py
          base="$(python3 -c 'import json; print(json.load(open("payload/manifest.json"))["base_commit"])')"
          mkdir -p "$RUNNER_TEMP/fpc-source"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 180 \
            "https://gitlab.com/freepascal.org/fpc/source/-/archive/$base/source-$base.tar.gz" \
            --output "$RUNNER_TEMP/fpc-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/fpc-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/fpc-source"
          cd "$RUNNER_TEMP/fpc-source"
          git apply --check "$GITHUB_WORKSPACE/payload/native-tls.patch"
          git apply "$GITHUB_WORKSPACE/payload/native-tls.patch"
          python3 "$GITHUB_WORKSPACE/ci/verify_applied.py" "$RUNNER_TEMP/fpc-source"
      - name: Provision owner-approved official temporary bootstrap and test hello
        if: inputs.official_bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/bootstrap.sh" '${{ matrix.arch }}' 2>&1 | tee "$RUNNER_TEMP/bootstrap.log"
      - name: Build and test native prerequisites and explicit smart selection
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/preflight.sh" "$RUNNER_TEMP/fpc-source" \
            "$RUNNER_TEMP/fpc-macos-preflight" '${{ matrix.arch }}' 2>&1 | tee "$RUNNER_TEMP/preflight.log"
      - name: Preserve per-architecture text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pure-pascal-preflight-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/bootstrap.log
            ${{ runner.temp }}/preflight.log
            ${{ runner.temp }}/fpc-official-bootstrap/logs/*.txt
            ${{ runner.temp }}/fpc-macos-preflight/*.log
            ${{ runner.temp }}/fpc-macos-preflight/*.txt
            ${{ runner.temp }}/fpc-macos-preflight/tls-fixtures/results.json
            ${{ runner.temp }}/fpc-macos-preflight/selector-fixtures/results.json
            ${{ runner.temp }}/fpc-macos-preflight/selector-fixtures/mock-libraries/**/*.log
      - name: Summarize scope
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Pure Pascal build/link, portable models, native selector and TLS acceptance are separate logged stages.' \
            'Check each stage and per-case results.json; an unrun stage or connection failure does not prove certificate validation.' >> "$GITHUB_STEP_SUMMARY"
